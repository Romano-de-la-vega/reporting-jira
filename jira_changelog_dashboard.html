 en delta", "history_id": "4393606", "comment_id": ""}, {"issue_id": "454501", "key": "PPMG-2177", "url": "https://data-servier.atlassian.net/browse/PPMG-2177", "summary": "[R&D] [DP --> VYP] [FLUX 2] Consolidation Actuals & Committed - Mise à jour quotidienne en delta", "project_key": "PPMG", "issue_type": "Story", "current_status": "In Refinement", "current_assignee": "Yosra MANAI", "current_sprints": "Sprint 17 2026", "event_date": "2026-08-10T07:22:31.183000+00:00", "author": "Yosra MANAI", "event_source": "changelog", "field": "Description", "field_id": "description", "change_type": "Description modifiée", "from_value": "+*Contexte*+ \n\nDans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des informations financières des projets.* ​\n\nDans le cas particulier des projets R&D présents dans VYP (Projets Enabling = Non-thérapeutique), cette consolidation se réalisera en 2 temps :\n\n# +_Pour les données prévisionnelles (finalisé)_++​+\n\n* une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP en 2025\n* depuis les données sont mises à jour dans VYP​\n\n# +_Pour les données réelles (à réaliser)_+\n\n* la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le type de données​\n* ces données sont ensuite transmises à la Data Platform (Data Warehouse Servier)​\n\nIl a été convenu suite à différents ateliers avec les métiers et le référents techniques que la point 2 sera réalisé en 3 “étapes” : \n\n* *ETAPE 1 (one-shot)* : Récupération de l’historique des données Actuals & Committed → [https://data-servier.atlassian.net/browse/PPMG-1528|https://data-servier.atlassian.net/browse/PPMG-1528|smart-link] \n* *ETAPE 2 (daily)* : Mise a jour quotidienne des données Actuals & Committed en delta → [https://data-servier.atlassian.net/browse/PPMG-2177|https://data-servier.atlassian.net/browse/PPMG-2177|smart-link] \n* *ETAPE 3 (adhoc au besoin)* : Resynchronisation des données [https://data-servier.atlassian.net/browse/PPMG-2178|https://data-servier.atlassian.net/browse/PPMG-2178|smart-link] \n\n+*Périmètre:*+\n\n* Interface DP → VYP via API Talend\n* Mise à jour des tables : Actual Expenditures, Planned Expenditures, Actual Hours\n\n+*Résultats attendus :*+\n\nMettre à jour les lignes de coût en fonction des informations reçues quotidiennement sur le sftp Planisware\n\nLe détail du besoin fonctionnels et informations est disponible dans le document [https://serviergroup.sharepoint.com/:p:/r/sites/PPMtoolsCORP/Documents%20partages/PPM%20GRP/02.%20Impl%C3%A9mentation%20-%20Ecosyst%C3%A8mes/1_R%26D/Interface%20DP-VYP%20(remont%C3%A9e%20r%C3%A9el)/VYP_Interface%20DP-VYP_Consolidation%20Actuals%20%26%20Committed.pptx?d=wc1a11bd2007a4e77ad539a08bdebec84&csf=1&web=1&e=FBHlwE|https://serviergroup.sharepoint.com/:p:/r/sites/PPMtoolsCORP/Documents%20partages/PPM%20GRP/02.%20Impl%C3%A9mentation%20-%20Ecosyst%C3%A8mes/1_R%26D/Interface%20DP-VYP%20(remont%C3%A9e%20r%C3%A9el)/VYP_Interface%20DP-VYP_Consolidation%20Actuals%20%26%20Committed.pptx?d=wc1a11bd2007a4e77ad539a08bdebec84&csf=1&web=1&e=FBHlwE|smart-link]", "to_value": "h3. +*Contexte*+ \n\nDans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des informations financières des projets.* ​\n\nDans le cas particulier des projets R&D présents dans VYP (Projets Enabling = Non-thérapeutique), cette consolidation se réalisera en 2 temps :\n\n# +_Pour les données prévisionnelles (finalisé)_++​+\n\n* une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP en 2025\n* depuis les données sont mises à jour dans VYP​\n\n# +_Pour les données réelles (à réaliser)_+\n\n* la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le type de données​\n* ces données sont ensuite transmises à la Data Platform (Data Warehouse Servier)​\n\nIl a été convenu suite à différents ateliers avec les métiers et le référents techniques que la point 2 sera réalisé en 3 “étapes” : \n\n* *FLUX 1 (one-shot)* : Récupération de l’historique des données Actuals & Committed → [https://data-servier.atlassian.net/browse/PPMG-1528|https://data-servier.atlassian.net/browse/PPMG-1528|smart-link] \n* *FLUX 2 (daily)* : Mise a jour quotidienne des données Actuals & Committed en delta → [https://data-servier.atlassian.net/browse/PPMG-2177|https://data-servier.atlassian.net/browse/PPMG-2177|smart-link] \n* *FLUX 3 (régulière)* : Resynchronisation des données [https://data-servier.atlassian.net/browse/PPMG-2178|https://data-servier.atlassian.net/browse/PPMG-2178|smart-link] \n\nh3. +*Périmètre:*+\n\n* Interface DP → VYP via API Talend\n* Mise à jour des tables : Actual Expenditures, Planned Expenditures, Actual Hours\n* *Source :* Data Platform\n* *Cible :* VYP Planisware via API Talend\n* *Format :* Fichier {{JSON}} transmis par API Talend\n* *Fréquence :* Quotidienne pour les mises à jour delta.\n* *Contenu :* Import quotidiennement les données de coûts delta R&D « Actuels » et « Committed » dans les tables : Actual Expenditures, Planned Expenditures, Actual Hours\n\nh3. +Mapping et description du fichier source:+ \n\nLe mapping détaillé entre les champs de la source et ceux de la cible est défini dans le fichier Excel [VYP_ConsolidationActualsCommittedRD_RequirementsList|https://serviergroup.sharepoint.com/:x:/r/sites/PPMtoolsCORP/_layouts/15/Doc.aspx?sourcedoc=%7B4213BED8-A51F-4DF3-A9BC-2A97707951E8%7D&file=VYP_ConsolidationActualsCommittedRD_INTERFACE_DP-TALEND-VYP_V1.xlsx&action=default&mobileredirect=true&DefaultItemOpen=1] dans les onglets suivants: \n\n* Format des fichiers \n* Planned Expenditures\n* Actual Expenditures\n* Actual Hours \n\nh3. +*Filtres à Appliquer par la Data Platform (avant dans VYP​ | | # +_Pour les données réelles (à réaliser)_+ | | * la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le type de données​ | * ces données sont ensuite transmises à la Data Platform (Data Warehouse Servier)​ | | Il a été convenu suite à di...", "to_excerpt": "h3. +*Contexte*+ | | Dans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des informations financières des projets.* ​ | | Dans le cas particulier des projets R&D présents dans VYP (Projets Enabling = Non-thérapeutique), cette consolidation se réalisera en 2 temps : | | # +_Pour les données prévisionnelles (finalisé)_++​+ | | * une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP en 2025 | * depuis les données sont mises à jour dans VYP​ | | # +_Pour les données réelles (à réaliser)_+ | | * la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le type de données​ | * ces données sont ensuite transmises à la Data Platform (Data Warehouse Servier)​ | | Il a été convenu suite à di...", "history_id": "4393715", "comment_id": ""}, {"issue_id": "454501", "key": "PPMG-2177", "url": "https://data-servier.atlassian.net/browse/PPMG-2177", "summary": "[R&D] [DP --> VYP] [FLUX 2] Consolidation Actuals & Committed - Mise à jour quotidienne en delta", "project_key": "PPMG", "issue_type": "Story", "current_status": "In Refinement", "current_assignee": "Yosra MANAI", "current_sprints": "Sprint 17 2026", "event_date": "2026-08-10T15:02:02.763000+00:00", "author": "Yosra MANAI", "event_source": "changelog", "field": "Acceptance Criteria", "field_id": "customfield_10056", "change_type": "Acceptance Criteria modifiés", "from_value": "VERIFICATION DES DONNEES MISES A JOUR DANS VYP\nAC 1 - Fréquence et Automatisme : L'interface récupère et traite les données quotidiennement selon la fréquence quotidienne\nAC 2 - Gestion des statuts de ligne (Delta) : Le système traite les actions en fonction du champ Line Status transmis par la DP :\n- New : Création d'une nouvelle entrée dans VYP.\n- Update : Mise à jour d'une ligne existante basée sur l' Immutable Key.\n- Delete : Suppression (ou mise à zéro) de la ligne correspondante dans VYP.\nAC 5 - Transformation des unités : Les données de temps passés (provenant de DOC ou PILOT) sont correctement converties (ex: heures en jours-hommes ou inversement) selon les règles de gestion définies dans la Data Platform avant exposition.\n\nVERIFICATION DES DONNEES EXPOSEES PAR LA DP\nAC 4 - Stabilité des filtres : Les filtres appliqués à l'étape 1 (types de projets, statuts, exclusion du code R900024) sont maintenus et vérifiés à chaque flux quotidien.\n\nNON TESTABLE EN UAT\nAC 6 - Synchronisation temporelle : L'Étape 2 démarre impérativement au jour \"Mise en Production (MEP) + 1\" après le succès de l'Étape 1.", "to_value": "AC-2 : Indépendance du Flux 2\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 1 et Flux 3.\nUn échec du Flux 1 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 2.\n\nAC-3 : Absence de timeout - Flux 2\nLe Flux 2 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-5: Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion dans Actual Expenditures (External/Actual)\nLorsque Cost_subtype = 'External' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Actual Expenditures.\n\nAC-5.2 : Insertion dans Actual Hours (Internal/Actual)\nLorsque Cost_subtype = 'Internal' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'Standard Payroll' et insérer la ligne de coût résultante dans la table Actual Hours.\n\nAC-5.3 : Insertion dans Planned Expenditures avec type \"Committed\"\nLorsque Cost_subtype = 'External' et Cost_status = 'Committed', VYP VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Planned Expenditures avec le type de dépense défini comme \"Committed\".\n\nAC-5.4 : Ingestion NEW réussie\nSi Line_Status = NEW et que l'immutable_key n'existe pas dans VYP, VYP doit ingérer la nouvelle ligne de données avec succès.\n\nAC-5.5 : Rejet NEW si immutable_key existe\nSi Line_Status = NEW et que l'immutable_key existe déjà dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans modifier les données existantes.\n\nAC-5.6 : Suppression DELETE réussie\nSi Line_Status = DELETE et que l'immutable_key existe dans VYP, VYP doit supprimer les données associées à cette immutable_key avec succès.\n\nAC-5.7 : Rejet DELETE si immutable_key n'existe pas\nSi Line_Status = DELETE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans tenter de suppression.\n\nAC-5.8 : Mise à jour UPDATE réussie\nSi Line_Status = UPDATE et que l'immutable_key existe dans VYP, VYP doit mettre à jour les données existantes associées à cette immutable_key avec succès.\n\nAC-5.9 : Rejet UPDATE si immutable_key n'existe pas\nSi Line_Status = UPDATE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans créer de nouvelle donnée.\n\nAC-5.10 : Validation Cost_Subtype - Invalide\nSi Cost_Subtype n'est ni 'External' ni 'Internal' (e.g., 'Other', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.11 : Validation Cost_status - Invalide\nSi Cost_status n'est ni 'Actual' ni 'Committed' (e.g., 'Forecast', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.12 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-5.13 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.14 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.15 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.16: Code projet introuvable\nLors de l’importation de coûts, si une ligne de données contient un project_code qui ne correspond à aucun projet existant dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.17: valeur vide, nul ou placeholder\nLors de l’importation de coûts, si une ligne de données contient un champ \"value\" qui est vide, nul, ou qu'il correspond à un \"placeholder\", VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise dans ses données.\n\nAC-7 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-8 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.", "from_excerpt": "VERIFICATION DES DONNEES MISES A JOUR DANS VYP | AC 1 - Fréquence et Automatisme : L'interface récupère et traite les données quotidiennement selon la fréquence quotidienne | AC 2 - Gestion des statuts de ligne (Delta) : Le système traite les actions en fonction du champ Line Status transmis par la DP : | - New : Création d'une nouvelle entrée dans VYP. | - Update : Mise à jour d'une ligne existante basée sur l' Immutable Key. | - Delete : Suppression (ou mise à zéro) de la ligne correspondante dans VYP. | AC 5 - Transformation des unités : Les données de temps passés (provenant de DOC ou PILOT) sont correctement converties (ex: heures en jours-hommes ou inversement) selon les règles de gestion définies dans la Data Platform avant exposition. | | VERIFICATION DES DONNEES EXPOSEES PAR LA DP | AC 4 - Stabilité des filtres : Les filtres appliqués à l'étape 1 (types de projets, statuts, e...", "to_exc ées et enregistrer une erreur, sans modifier les données existantes.\n\nAC-5.6 : Suppression DELETE réussie\nSi Line_Status = DELETE et que l'immutable_key existe dans VYP, VYP doit supprimer les données associées à cette immutable_key avec succès.\n\nAC-5.7 : Rejet DELETE si immutable_key n'existe pas\nSi Line_Status = DELETE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans tenter de suppression.\n\nAC-5.8 : Mise à jour UPDATE réussie\nSi Line_Status = UPDATE et que l'immutable_key existe dans VYP, VYP doit mettre à jour les données existantes associées à cette immutable_key avec succès.\n\nAC-5.9 : Rejet UPDATE si immutable_key n'existe pas\nSi Line_Status = UPDATE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans créer de nouvelle donnée.\n\nAC-5.10 : Validation Cost_Subtype - Invalide\nSi Cost_Subtype n'est ni 'External' ni 'Internal' (e.g., 'Other', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.11 : Validation Cost_status - Invalide\nSi Cost_status n'est ni 'Actual' ni 'Committed' (e.g., 'Forecast', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.12 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-5.13 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.14 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque lig ing VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion dans Actual Expenditures (External/Actual)\nLorsque Cost_subtype = 'External' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Actual Expenditures.\n\nAC-5.2 : Insertion dans Actual Hours (Internal/Actual)\nLorsque Cost_subtype = 'Internal' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'Standard Payroll' et insérer la ligne de coût résultante dans la table Actual Hours.\n\nAC-5.3 : Insertion dans Planned Expenditures avec type \"Committed\"\nLorsque Cost_subtype = 'External' et Cost_status = 'Committed', VYP VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Planned Expenditures avec le type de dépense défini comme \"Committed\".\n\nAC-5.4 : Ingestion NEW réussie\nSi Line_Status = NEW et que l'immutable_key n'existe pas dans VYP, VYP doit ingérer la nouvelle ligne de données avec succès.\n\nAC-5.5 : Rejet NEW si immutable_key existe\nSi Line_Status = NEW et que l'immutable_key existe déjà dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans modifier les données existantes.\n\nAC-5.6 : Suppression DELETE réussie\nSi Line_Status = DELETE et que l'immutable_key existe dans VYP, VYP doit supprimer les données associées à cette immutable_key avec succès.\n\nAC-5.7 : Rejet DELETE si immutable_key n'existe pas\nSi Line_Status = DELETE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans tenter de suppression.\n\nAC-5.8 : Mise à jour UPDATE réussie\nSi Line_Status = UPDATE et que l'immutable_key existe dans VYP, VYP doit mettre à jour les données existantes associées à cette immutable_key avec succès.\n\nAC-5.9 : Rejet UPDATE si immutable_key n'existe pas\nSi Line_Status = UPDATE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans créer de nouvelle donnée.\n\nAC-5.10 : Validation Cost_Subtype - Invalide\nSi Cost_Subtype n'est ni 'External' ni 'Internal' (e.g., 'Other', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.11 : Validation Cost_status - Invalide\nSi Cost_status n'est ni 'Actual' ni 'Committed' (e.g., 'Forecast', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.12 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-5.13 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.14 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.15 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.16: Code projet introuvable\nLors de l’importation de coûts, si une ligne de données contient un project_code qui ne correspond à aucun projet existant dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.17: valeur vide, nul ou placeholder\nLors de l’importation de coûts, si une ligne de données contient un champ \"value\" qui est vide, nul, ou qu'il correspond à un \"placeholder\", VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise dans ses données.\n\nAC-7 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-8 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-11 : Accès en écriture autorisé pour le profil P_ADM\nUn utilisateur ayant le profil P_ADM doit pouvoir modifier (cocher/décocher) et sauvegarder la valeur du booléen \"Exclure la remontée du réel de la Data Platform\" sur une classe projet.\nUn utilisateur n'ayant pas le profil P_ADM (PFM ou IO) ne doit pas pouvoir modifier la valeur du booléen \"Exclure la remontée du réel de la Data Platform\".\n\nAC-12 : Importation de coûts, quel que soit le statut du projet\nL'importation ne doit pas échouer en raison du statut du projet.\nVYP doit pouvoir importer et traiter correctement les lignes de coûts (Actuals et Committed) pour un projet, indépendamment de son statut actuel dans VYP.\nL'importation des données de coûts ne doit en aucun cas être bloquée ou échouer en raison du statut actuel du projet.\n\nAC-13 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Mécanisme de mise à jour Delta pour les coûts\nLe Flux 2 doit identifier et traiter uniquement les données de coûts qui ont été créées, modifiées ou supprimées depuis la dernière exécution réussie du flux.\nLors de son exécution, le Flux 2 ne doit pas réimporter ou retraiter l'intégralité du volume de données de coûts si aucune modification n'a été détectée.\n\nAC-2 : Mécanisme de transmission des données (API Talend)\nLe fichier JSON contenant les données de coûts doit être transmis au Flux 2 via une invocation d'API spécifique gérée par Talend.\nLe Flux 2 doit être capable de recevoir et de traiter les requêtes provenant de cette API Talend\n\nAC-3 : Indépendance du Flux 2\nLe Flux 2 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 1 et Flux 3.\nUn échec du Flux 1 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 2.\n\nAC-4 : Absence de timeout - Flux 2\nLe Flux 2 (mise à jour quotidienne en delta) doit s'exécuter de manière complète pour le volume de données quotidien attendu sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-5 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-6: Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_Require  avec succès.\n\nAC-6.9 : Rejet UPDATE si immutable_key n'existe pas\nSi Line_Status = UPDATE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans créer de nouvelle donnée.\n\nAC-6.10 : Validation Cost_Subtype - Invalide\nSi Cost_Subtype n'est ni 'External' ni 'Internal' (e.g., 'Other', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6.11 : Validation Cost_status - Invalide\nSi Cost_status n'est ni 'Actual' ni 'Committed' (e.g., 'Forecast', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6.12 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-6.13 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-6.14 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-6.15 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6.16: Code projet introuvable\nLors de l’importation de coûts, si une ligne de données contient un project_code qui ne correspond à aucun projet existant dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6.17: valeur vide, nul ou placeholder\nLors de l’importation de coûts, si une ligne de données contient un champ \"value\" qui est vide, nul, ou qu'il correspond à un \"placeholder\", VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-7 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise dans ses données.\n\nAC-8 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-9 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-10 : Accès en écriture autorisé pour le profil P_ADM\nUn utilisateur ayant le profil P_ADM doit pouvoir modifier (cocher/décocher) et sauvegarder la valeur du booléen \"Exclure la remontée du réel de la Data Platform\" sur une classe projet.\nUn utilisateur n'ayant pas le profil P_ADM (PFM ou IO) ne doit pas pouvoir modifier la valeur du booléen \"Exclure la remontée du réel de la Data Platform\".\n\nAC-11 : Importation de coûts, quel que soit le statut du projet\nL'importation ne doit pas échouer en raison du statut du projet.\nVYP doit pouvoir importer et traiter correctement les lignes de coûts (Actuals et Committed) pour un projet, indépendamment de son statut actuel dans VYP.\nL'importation des données de coûts ne doit en aucun cas être bloquée ou échouer en raison du statut actuel du projet.\n\nAC-12 : Conformité au document de référence\nL'implémentation du able dans le module \"Administration\".\n\nAC-6.16: Code projet introuvable\nLors de l’importation de coûts, si une ligne de données contient un project_code qui ne correspond à aucun projet existant dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6.17: valeur vide, nul ou placeholder\nLors de l’importation de coûts, si une ligne de données contient un champ \"value\" qui est vide, nul, ou qu'il correspond à un \"placeholder\", VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-7 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise dans ses données.\n\nAC-8 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-9 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-10 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-10 : Accès en écriture autorisé pour le profil P_ADM\nUn utilisateur ayant le profil P_ADM doit pouvoir modifier (cocher/décocher) et sauvegarder la valeur du booléen \"Exclure la remontée du réel de la Data Platform\" sur une classe projet.\nUn utilisateur n'ayant pas le profil P_ADM (PFM ou IO) ne doit pas pouvoir modifier la valeur du booléen \"Exclure la remontée du réel de la Data Platform\".\n\nAC-11 : Importation de coûts, quel que soit le st é pour le profil P_ADM\nUn utilisateur ayant le profil P_ADM doit pouvoir modifier (cocher/décocher) et sauvegarder la valeur du booléen \"Exclure la remontée du réel de la Data Platform\" sur une classe projet.\nUn utilisateur n'ayant pas le profil P_ADM (PFM ou IO) ne doit pas pouvoir modifier la valeur du booléen \"Exclure la remontée du réel de la Data Platform\".\n\nAC-12 : Importation de coûts, quel que soit le statut du projet\nL'importation ne doit pas échouer en raison du statut du projet.\nVYP doit pouvoir importer et traiter correctement les lignes de coûts (Actuals et Committed) pour un projet, indépendamment de son statut actuel dans VYP.\nL'importation des données de coûts ne doit en aucun cas être bloquée ou échouer en raison du statut actuel du projet.\n\nAC-13 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Mécanisme de mise à jour Delta pour les coûts\nLe Flux 2 doit identifier et traiter uniquement les données de coûts qui ont été créées, modifiées ou supprimées depuis la dernière exécution réussie du flux.\nLors de son exécution, le Flux 2 ne doit pas réimporter ou retraiter l'intégralité du volume de données de coûts si aucune modification n'a été détectée.\n\nAC-2 : Mécanisme de transmission des données (API Talend)\nLe fichier JSON contenant les données de coûts doit être transmis au Flux 2 via une invocation d'API spécifique gérée par Talend.\nLe Flux 2 doit être capable de recevoir et de traiter les requêtes provenant de cette API Talend\n\nAC-3 : Indépendance du Flux 2\nLe Flux 2 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 1 et Flux 3.\nUn échec du Flux 1 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 2.\n\nAC-4 : Absence de timeout - Flux 2\nLe Flux 2 (mise cument VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Mécanisme de mise à jour Delta pour les coûts\nLe Flux 2 doit identifier et traiter uniquement les données de coûts qui ont été créées, modifiées ou supprimées depuis la dernière exécution réussie du flux.\nLors de son exécution, le Flux 2 ne doit pas réimporter ou retraiter l'intégralité du volume de données de coûts si aucune modification n'a été détectée.\n\nAC-2 : Mécanisme de transmission des données (API Talend)\nLe fichier JSON contenant les données de coûts doit être transmis au Flux 2 via une invocation d'API spécifique gérée par Talend.\nLe Flux 2 doit être capable de recevoir et de traiter les requêtes provenant de cette API Talend\n\nAC-3 : Absence de timeout - Flux 2\nLe Flux 2 (mise à jour quotidienne en delta) doit s'exécuter de manière complète pour le volume de données quotidien attendu sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-5: Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion dans Actual Expenditures (External/Actual)\nLorsque Cost_subtype = 'External' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Actual Expenditures.\n\nAC-5.2 : Insertion dans Actual Hours (Internal/Actual)\nLorsque Cost_subtype = 'Internal' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'Standard Payroll' et insérer la ligne de coût résultante dans la table Actual Hours.\n\nAC-5.3 : Insertion dans Planned Expenditures avec type \"Committed\"\nLorsque Cost_subtype = 'External' et Cost_status = 'Committed', VYP VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Planned Expenditures avec le type de dépense défini comme \"Committed\".\n\nAC-5.4 : Ingestion NEW réussie\nSi Line_Status = NEW et que l'immutable_key n'existe pas dans VYP, VYP doit ingérer la nouvelle ligne de données avec succès.\n\nAC-5.5 : Rejet NEW si immutable_key existe\nSi Line_Status = NEW et que l'immutable_key existe déjà dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans modifier les données existantes.\n\nAC-5.6 : Suppression DELETE réussie\nSi Line_Status = DELETE et que l'immutable_key existe dans VYP, VYP doit supprimer les données associées à cette immutable_key avec succès.\n\nAC-5.7 : Rejet DELETE si immutable_key n'existe pas\nSi Line_Status = DELETE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans tenter de suppression.\n\nAC-5.8 : Mise à jour UPDATE réussie\nSi Line_Status = UPDATE et que l'immutable_key existe dans VYP, VYP doit mettre à jour les données existantes associées à cette immutable_key avec succès.\n\nAC-5.9 : Rejet UPDATE si immutable_key n'existe pas\nSi Line_Status = UPDATE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans créer de nouvelle donnée.\n\nAC-5.10 : Validation Cost_Subtype - Invalide\nSi Cost_Subtype n'est ni 'External' ni 'Internal' (e.g., 'Other', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.11 : Validation Cost_status - Invalide\nSi Cost_status n'est ni 'Actual' ni 'Committed' (e.g., 'Forecast', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.12 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-5.13 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.14 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.15 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.16: Code projet introuvable\nLors de l’importation de coûts, si une ligne de données contient un project_code qui ne correspond à aucun projet existant dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.17: valeur vide, nul ou placeholder\nLors de l’importation de coûts, si une ligne de données contient un champ \"value\" qui est vide, nul, ou qu'il correspond à un \"placeholder\", VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise PPMG-2177", "url": "https://data-servier.atlassian.net/browse/PPMG-2177", "summary": "[R&D] [DP --> VYP] [FLUX 2] Consolidation Actuals & Committed - Mise à jour quotidienne en delta", "project_key": "PPMG", "issue_type": "Story", "current_status": "In Refinement", "current_assignee": "Yosra MANAI", "current_sprints": "Sprint 17 2026", "event_date": "2026-08-10T15:51:30.306000+00:00", "author": "Yosra MANAI", "event_source": "changelog", "field": "Description", "field_id": "description", "change_type": "Description modifiée", "from_value": "h3. +*Contexte*+ \n\nDans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des informations financières des projets.* ​\n\nDans le cas particulier des projets R&D présents dans VYP (Projets Enabling = Non-thérapeutique), cette consolidation se réalisera en 2 temps :\n\n# +_Pour les données prévisionnelles (finalisé)_++​+\n\n* une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP en 2025\n* depuis les données sont mises à jour dans VYP​\n\n# +_Pour les données réelles (à réaliser)_+\n\n* la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le type de données​\n* ces données sont ensuite transmises à la Data Platform (Data Warehouse Servier)​\n\nIl a été convenu suite à différents ateliers avec les métiers et le référents techniques que la point 2 sera réalisé en 3 “étapes” : \n\n* *FLUX 1 (one-shot)* : Récupération de l’historique des données Actuals & Committed → [https://data-servier.atlassian.net/browse/PPMG-1528|https://data-servier.atlassian.net/browse/PPMG-1528|smart-link] \n* *FLUX 2 (daily)* : Mise a jour quotidienne des données Actuals & Committed en delta → [https://data-servier.atlassian.net/browse/PPMG-2177|https://data-servier.atlassian.net/browse/PPMG-2177|smart-link] \n* *FLUX 3 (régulière)* : Resynchronisation des données [https://data-servier.atlassian.net/browse/PPMG-2178|https://data-servier.atlassian.net/browse/PPMG-2178|smart-link] \n\nh3. +*Périmètre:*+\n\n* *Source :* Data Platform\n* *Cible :* VYP Planisware via API Talend\n* *Format :* Fichier {{JSON}} transmis par API Talend\n* *Fréquence :* Quotidienne pour les mises à jour delta.\n* *Contenu :* Import quotidiennement les données de coûts delta R&D « Actuels » et « Committed » dans les tables : Actual Expenditures, Planned Expenditures, Actual Hours\n\nh3. +Mapping et description du fichier source:+ \n\nLe mapping détaillé entre les champs de la source et ceux de la cible est défini dans le fichier Excel [VYP_ConsolidationActualsCommittedRD_RequirementsList|https://serviergroup.sharepoint.com/:x:/r/sites/PPMtoolsCORP/_layouts/15/Doc.aspx?sourcedoc=%7B4213BED8-A51F-4DF3-A9BC-2A97707951E8%7D&file=VYP_ConsolidationActualsCommittedRD_INTERFACE_DP-TALEND-VYP_V1.xlsx&action=default&mobileredirect=true&DefaultItemOpen=1] dans les onglets suivants: \n\n* Format des fichiers \n* Planned Expenditures\n* Actual Expenditures\n* Actual Hours \n\nh3. +*Filtres à Appliquer par la Data Platform (avant partage du fichier .csv) :*+\n\n* Inclure uniquement les lignes où {{'Project_type_Level_2' = 'Enabling projects'}}.\n* Inclure uniquement les lignes où {{'Project_status' = 'on going ou suspended ou stopped'}}.\n* Exclure les lignes pour lesquelles {{Account code = « R90024 »}} (correspondant aux coûts de refacturation DDSI sur la R&D).\n\nh3. +*Traitement attendu:*+\n\nMettre à jour les lignes de coût en fonction des informations reçues quotidiennement sur le sftp Planisware\n\n*Document de référence pour les spécifications fonctionnelles détaillées:* [VYP_Interface DP-VYP_Consolidation Actuals & Committed|https://serviergroup.sharepoint.com/:p:/r/sites/PPMtoolsCORP/_layouts/15/Doc.aspx?sourcedoc=%7BC1A11BD2-007A-4E77-AD53-9A08BDEBEC84%7D&file=VYP_Interface%20DP-VYP_Consolidation%20Actuals%20&%20Committed.pptx=&action=edit&mo const issues = DATA.issues;
const events = DATA.events;
const state = { type:'Tous', sprint:'Tous', status:'Tous', field:'Tous', ticket:'Tous', q:'', start:'', end:'' };
function uniq(arr) { return ['Tous', ...Array.from(new Set(arr.filter(x => x && String(x).trim()))).sort((a,b)=>String(a).localeCompare(String(b)))] }
function fillSelect(id, values) { const el=document.getElementById(id); el.innerHTML=''; values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; el.appendChild(o); }); el.onchange=()=>{ const key=id.replace('Filter',''); state[key]=el.value; render(); } }
function init() {
  fillSelect('typeFilter', uniq(issues.map(i=>i.issue_type)));
  fillSelect('sprintFilter', uniq(issues.flatMap(i=>String(i.sprint_names||'').split('; ').filter(Boolean))));
  fillSelect('statusFilter', uniq(issues.map(i=>i.status)));
  fillSelect('fieldFilter', uniq(events.map(e=>e.field)));
  fillSelect('ticketFilter', uniq(issues.map(i=>i.key)));
  document.getElementById('searchBox').oninput = e => { state.q=e.target.value.toLowerCase(); render(); };
  document.getElementById('dateStart').onchange = e => { state.start=e.target.value; render(); };
  document.getElementById('dateEnd').onchange = e => { state.end=e.target.value; render(); };
  prefillDates();
  render();
}
function prefillDates() {
  const dates = events.map(e=>e.event_date).filter(Boolean).sort();
  if(dates.length) {
    document.getElementById('dateStart').value = dates[0].slice(0,10); state.start = dates[0].slice(0,10);
    document.getElementById('dateEnd').value = dates[dates.length-1].slice(0,10); state.end = dates[dates.length-1].slice(0,10);
  }
}
function datePass(s) {
  if(!s) return true;
  const d = new Date(s);
  if(state.start && d < new Date(state.start+'T00:00:00')) return false;
  if(state.end && d > new Date(state.end+'T23:59:59')) return false;
  return true;
}
function issuePass(i) {
  if(state.type !== 'Tous' && i.issue_type !== state.type) return false;
  if(state.sprint !== 'Tous' && !String(i.sprint_names||'').split('; ').includes(state.sprint)) return false;
  if(state.status !== 'Tous' && i.status !== state.status) return false;
  if(state.ticket !== 'Tous' && i.key !== state.ticket) return false;
  const q = state.q;
  if(q && !(String(i.key+' '+i.summary+' '+i.assignee+' '+i.sprint_names).toLowerCase().includes(q))) return false;
  return true;
}
function eventPass(e, issueSet) {
  if(!issueSet.has(e.issue_id)) return false;
  if(!datePass(e.event_date)) return false;
  if(state.field !== 'Tous' && e.field !== state.field) return false;
  const q = state.q;
  if(q && !(String(e.key+' '+e.summary+' '+e.author+' '+e.field+' '+e.from_excerpt+' '+e.to_excerpt+' '+e.from_value+' '+e.to_value).toLowerCase().includes(q))) return false;
  return true;
}
function render() {
  const filteredIssues = issues.filter(issuePass);
  const issueSet = new Set(filteredIssues.map(i=>i.issue_id));
  const filteredEvents = events.filter(e=>eventPass(e, issueSet));
  renderCards(filteredIssues, filteredEvents);
  renderGlobal(filteredIssues, filteredEvents);
  renderFields(filteredEvents);
  renderTickets(filteredIssues, filteredEvents);
  renderTimeline(filteredIssues, filteredEvents);
}
function renderCards(is, es) {
  const descTickets = new Set(es.filter(e=>e.field==='Description').map(e=>e.issue_id)).size;
  const acTickets = new Set(es.filter(e=>e.field==='Acceptance Criteria').map(e=>e.issue_id)).size;
  const cards = [
    ['Tickets', is.length], ['Événements', es.length], ['Tickets Description', descTickets], ['Tickets AC', acTickets],
    ['Modifs AC', es.filter(e=>e.field==='Acceptance Criteria').length], ['Modifs Description', es.filter(e=>e.field==='Description').length],
    ['Réassignations', es.filter(e=>e.field==='Assignation').length], ['Statuts', es.filter(e=>e.field==='Statut').length]
  ];
  document.getElementById('cards').innerHTML = cards.map(c=>`<div class="card"><div class="label">${c[0]}</div><div class="value">${c[1]}</div></div>`).join('');
}
function renderGlobal(is, es) {
  const days={}; es.forEach(e=>{ const k=(e.event_date||'').slice(0,10)||'Sans date'; days[k]=(days[k]||0)+1; });
  const max=Math.max(...Object.values(days),1);
  const bars=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>`<div class="bar"><span>${escapeHtml(k)}</span><span style="width:${Math.max(4,Math.round(v/max*100))}%"></span><b>${v}</b></div>`).join('');
  document.getElementById('globalPanel').innerHTML = `<div class="small-note">Période sélectionnée : <b>${state.start||'début'}</b> → <b>${state.end||'fin'}</b></div>${bars||'<p>Aucun événement.</p>'}`;
}
function renderFields(es) {
  const c={}; es.forEach(e=>c[e.field]=(c[e.field]||0)+1); const max=Math.max(...Object.values(c),1);
  document.getElementById('fieldPanel').innerHTML = Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${escapeHtml(k)}</span><span style="width:${Math.max(4,Math.round(v/max*100))}%"></span><b>${v}</b></div>`).join('') || '<p>Aucun événement.</p>';
}
function renderTickets(is, es) {
  const counts = new Map(); es.forEach(e=>counts.set(e.issue_id,(counts.get(e.issue_id)||0)+1));
  const sorted = [...is].sort((a,b)=>(counts.get(b.issue_id)||0)-(counts.get(a.issue_id)||0));
  document.getElementById('ticketList').innerHTML = sorted.slice(0,200).map(i=>`<div class="ticket ${state.ticket===i.key?'active':''}" onclick="state.ticket='${i.key}'; document.getElementById('ticketFilter').value='${i.key}'; render();"><span class="key">${i.key}</span> <span class="badge">${i.issue_type}</span><div>${escapeHtml(i.summary||'')}</div><div class="meta">${i.status||''} · ${i.assignee||''} · ${i.sprint_names||''} · ${counts.get(i.issue_id)||0} event(s)</div></div>`).join('');
}
function eventClass(e) { if(e.field==='Description') return 'desc'; if(e.field==='Acceptance Criteria') return 'ac'; if(e.field==='Statut') return 'status'; if(e.field==='Assignation') return 'assign'; if(e.field==='Commentaire') return 'comment'; return ''; }
function renderTimeline(is, es) {
  const byIssue={}; es.forEach(e=>{ if(!byIssue[e.issue_id]) byIssue[e.issue_id]=[]; byIssue[e.issue_id].push(e); });
  const issueMap = Object.fromEntries(is.map(i=>[i.issue_id,i]));
  const issueIds = Object.keys(byIssue).sort((a,b)=> byIssue[b].length - byIssue[a].length).slice(0,80);
  if(!issueIds.length) { document.getElementById('timeline').innerHTML='<p>Aucun événement pour les filtres sélectionnés.</p>'; return; }
  document.getElementById('timeline').innerHTML = issueIds.map(id=>{
    const i=issueMap[id]||{key:id,summary:'',status:'',assignee:'',sprint_names:''};
    const evs=byIssue[id].sort((a,b)=>String(b.event_date).localeCompare(String(a.event_date))).slice(0,100);
    return `<section class="ticket-section"><h3>${escapeHtml(i.key)} · ${escapeHtml(i.summary||'')}</h3><div class="ticket-meta">${escapeHtml(i.status||'')} · ${escapeHtml(i.assignee||'')} · ${escapeHtml(i.sprint_names||'')} · ${evs.length} événement(s)</div><div class="timeline">` + evs.map(eventHtml).join('') + `</div></section>`;
  }).join('');
}
function eventHtml(e) {
  const precise = (e.field==='Description' || e.field==='Acceptance Criteria' || e.field==='Résumé' || e.field==='Commentaire') ? `<div class="precise-title">Diff précis</div><div class="precise">${preciseDiff(e.from_value||'', e.to_value||'')}</div>` : '';
  const beforeAfter = `<div class="diff"><div><b>Avant</b><br>${escapeHtml(e.from_excerpt||e.from_value||'')}</div><div><b>Après</b><br>${escapeHtml(e.to_excerpt||e.to_value||'')}</div></div>`;
  return `<div class="event ${eventClass(e)}"><div class="top"><div><span class="field">${escapeHtml(e.field)}</span> <span class="badge">${escapeHtml(e.key)}</span> <span class="badge">${escapeHtml(e.author||'')}</span></div><div class="date">${formatDate(e.event_date)}</div></div><div>${escapeHtml(e.change_type)} · <a href="${e.url}" target="_blank">ouvrir Jira</a></div>${precise}${beforeAfter}</div>`;
}
function preciseDiff(a,b) {
  a=String(a||''); b=String(b||'');
  if(a===b) return '<span class="context">Aucun changement textuel détecté.</span>';
  const ta = tokenize(a), tb = tokenize(b);
  if(ta.length>850 || tb.length>850) return diffWindow(a,b);
  const n=ta.length,m=tb.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=ta[i]===tb[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out='';
  while(i<n && j<m) {
    if(ta[i]===tb[j]) { out += '<span class="context">'+escapeHtml(ta[i])+'</span>'; i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) { out += '<del>'+escapeHtml(ta[i])+'</del>'; i++; }
    else { out += '<ins>'+escapeHtml(tb[j])+'</ins>'; j++; }
  }
  while(i<n) out += '<del>'+escapeHtml(ta[i++])+'</del>';
  while(j<m) out += '<ins>'+escapeHtml(tb[j++])+'</ins>';
  return out;
}
function tokenize(s) { return String(s||'').match(/\s+|[A-Za-zÀ-ÿ0-9_]+|[^A-Za-zÀ-ÿ0-9_\s]/g) || []; }
function diffWindow(a,b) {
  let start=0; const min=Math.min(a.length,b.length);
  while(start<min && a[start]===b[start]) start++;
  let endA=a.length-1,endB=b.length-1;
  while(endA>=start && endB>=start && a[endA]===b[endB]) { endA--; endB--; }
  const ctx=180;
  const prefix=a.slice(Math.max(0,start-ctx),start);
  const oldFrag=a.slice(start,endA+1);
  const newFrag=b.slice(start,endB+1);
  const suffix=a.slice(endA+1,Math.min(a.length,endA+1+ctx));
  return '<span class="context">'+escapeHtml((start>ctx?'…':'')+prefix)+'</span>' + (oldFrag?'<del>'+escapeHtml(oldFrag)+'</del>':'') + (newFrag?'<ins>'+escapeHtml(newFrag)+'</ins>':'') + '<span class="context">'+escapeHtml(suffix+(endA+1+ctx<a.length?'…':''))+'</span>';
}
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatDate(s) { if(!s) return ''; const d=new Date(s); return isNaN(d) ? s : d.toLocaleString('fr-FR'); }
