<style>
:root { --dark: #17365D;
--primary: #1F4E78;
--accent: #F4B183;

* { box-sizing: border-box; }
body { margin:0; font-family: Segoe UI, Arial, sans-serif; background:#f7f9fc; color:#111827; }
header { background:var(--dark); color:white; padding:22px 32px; }
header h1 { margin:0; font-size:24px; }
header p { margin:6px 0 0 0; opacity:.85; }
.container { padding:22px 32px; }
.filters { display:grid; grid-template-columns: repeat(8, minmax(135px,1fr)); gap:12px; background:white; padding:16px; border-radius:14px; box-shadow:0 1px 5px rgba(15,23,42,.10); position:sticky; top:0; z-index:5; }
label { font-size:12px; font-weight:700; color:#374151; display:block; margin-bottom:4px; }
select,input { width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:8px; background:white; }
.cards { display:grid; grid-template-columns: repeat(8, 1fr); gap:14px; margin:18px 0; }
.card { background:white; border-left:6px solid var(--primary); border-radius:14px; padding:14px; box-shadow:0 1px 5px rgba(15,23,42,.10); }
.card .label { font-size:12px; color:#64748b; font-weight:700; }
.card .value { font-size:26px; font-weight:800; color:var(--dark); margin-top:4px; }
.global { display:grid; grid-template-columns: 1.2fr 1fr; gap:18px; margin-bottom:18px; }
.grid { display:grid; grid-template-columns: 380px 1fr; gap:18px; align-items:start; }
.panel { background:white; border-radius:14px; padding:16px; box-shadow:0 1px 5px rgba(15,23,42,.10); }
.panel h2 { margin:0 0 12px 0; color:var(--dark); font-size:18px; }
.ticket { border:1px solid #e5e7eb; border-radius:10px; padding:10px; margin-bottom:8px; cursor:pointer; }
.ticket:hover { border-color:var(--primary); background:#f8fbff; }
.ticket.active { border-color:var(--accent); background:#fffbeb; }
.ticket .key { font-weight:800; color:var(--primary); }
.ticket .meta { font-size:12px; color:#64748b; margin-top:4px; }
.ticket-section { margin-bottom:22px; border:1px solid #e5e7eb; border-radius:14px; overflow:hidden; }
.ticket-section h3 { margin:0; padding:12px 14px; background:#eef6ff; color:var(--dark); font-size:16px; }
.ticket-section .ticket-meta { padding:0 14px 12px 14px; color:#64748b; font-size:12px; background:#eef6ff; }
.timeline { position:relative; margin-left:12px; border-left:3px solid #dbeafe; padding:14px 12px 4px 18px; }
.event { position:relative; margin:0 0 14px 0; padding:12px; border-radius:12px; background:#f8fafc; border:1px solid #e5e7eb; }
.event:before { content:""; position:absolute; left:-27px; top:16px; width:14px; height:14px; border-radius:50%; background:var(--primary); border:3px solid white; box-shadow:0 0 0 2px #bfdbfe; }
.event.desc:before { background:var(--green); }
.event.ac:before { background:var(--accent); }
.event.status:before { background:var(--teal); }
.event.assign:before { background:var(--red); }
.event.comment:before { background:#64748b; }
.event .top { display:flex; justify-content:space-between; gap:12px; }
.event .field { font-weight:800; color:var(--dark); }
.event .date { color:#64748b; font-size:12px; white-space:nowrap; }
.precise { margin-top:10px; background:white; border:1px solid #e5e7eb; border-radius:8px; padding:10px; white-space:pre-wrap; line-height:1.55; max-height:260px; overflow:auto; font-size:13px; }
.precise-title { margin-top:10px; font-size:12px; font-weight:800; color:#334155; }
.diff { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px; }
.diff div { background:white; border-radius:8px; padding:8px; border:1px solid #e5e7eb; font-size:12px; white-space:pre-wrap; max-height:160px; overflow:auto; }
ins { background:#dcfce7; color:#166534; text-decoration:none; border-radius:3px; padding:0 2px; font-weight:700; }
del { background:#fee2e2; color:#991b1b; text-decoration:line-through; border-radius:3px; padding:0 2px; font-weight:700; }
.context { color:#475569; }
.badge { display:inline-block; padding:3px 8px; border-radius:999px; background:#e0f2fe; color:#075985; font-size:11px; font-weight:700; margin-right:4px; }
.bars { margin-top:12px; }
.bar { display:grid; grid-template-columns: 170px 1fr 50px; gap:8px; align-items:center; margin:6px 0; font-size:12px; }
.bar span:nth-child(2) { height:12px; background:linear-gradient(90deg,var(--primary),var(--teal)); border-radius:999px; }
.small-note { color:#64748b; font-size:12px; margin-top:8px; }
@media(max-width:1200px) { .filters,.cards { grid-template-columns: repeat(2, 1fr); } .grid,.global { grid-template-columns:1fr; } }

ion de l'historique (one shot) [ETAPE 1]", "to_excerpt": "[R&D] [DP -> VYP] [FLUX 1] Consolidation Actuals & Committed - Récupération de l'historique (one shot)", "history_id": "4393142", "comment_id": ""}, {"issue_id": "382401", "key": "PPMG-1528", "url": "https://data-servier.atlassian.net/browse/PPMG-1528", "summary": "[R&D] [DP -> VYP] [FLUX 1] Consolidation Actuals & Committed - Récupération de l'historique (one shot)", "project_key": "PPMG", "issue_type": "Story", "current_status": "In Refinement", "current_assignee": "Yosra MANAI", "current_sprints": "Sprint 17 2026", "event_date": "2026-08-09T15:57:29.911000+00:00", "author": "Yosra MANAI", "event_source": "changelog", "field": "Description", "field_id": "description", "change_type": "Description modifiée", "from_value": "+*Contexte*+ \n\nDans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des informations financières des projets.* ​\n\nDans le cas particulier des projets R&D présents dans VYP (Projets Enabling = Non-thérapeutique), cette consolidation se réalisera en 2 temps :\n\n# _Pour les données prévisionnelles (finalisé)_​\n\n* une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP en 2025 \n* depuis les données sont mises à jour dans VYP​\n\n# _Pour les données réelles (à réaliser)_\n\n* la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le type de données​\n* ces données sont ensuite transmises à la Data Platform (Data Warehouse Servier)​\n\nIl a été convenu suite à différents ateliers avec les métiers et le référents techniques que la point 2 sera réalisé en 3 “étapes/cas” : \n\n* *ETAPE 1 (one-shot)* : Récupération de l’historique des données Actuals & Committed → [https://data-servier.atlassian.net/browse/PPMG-1528|https://data-servier.atlassian.net/browse/PPMG-1528|smart-link] \n* *ETAPE 2 (daily)* : Mise a jour quotidienne des données Actuals & Committed en delta → [https://data-servier.atlassian.net/browse/PPMG-2177|https://data-servier.atlassian.net/browse/PPMG-2177|smart-link] \n* *ETAPE 3 (adhoc au besoin)* : Resynchronisation des données [https://data-servier.atlassian.net/browse/PPMG-2178|https://data-servier.atlassian.net/browse/PPMG-2178|smart-link] \n\n+*Périmètre:*+\n\n* Interface DP → VYP via API Talend\n* Mise à jour des tables : Actual Expenditures, Planned Expenditures, Actual Hours\n\n+*Résultats attendus :*+\n\nInjecter en masse les données partagées par la DP au format .csv.\n\nLe détail du besoin fonctionnel et informations sont disponibles dans le document [https://serviergroup.sharepoint.com/:p:/r/sites/PPMtoolsCORP/Documents%20partages/PPM%20GRP/02.%20Impl%C3%A9mentation%20-%20Ecosyst%C3%A8mes/1_R%26D/Interface%20DP-VYP%20(remont%C3%A9e%20r%C3%A9el)/VYP_Interface%20DP-VYP_Consolidation%20Actuals%20%26%20Committed.pptx?d=wc1a11bd2007a4e77ad539a08bdebec84&csf=1&web=1&e=FBHlwE|https://serviergroup.sharepoint.com/:p:/r/sites/PPMtoolsCORP/Documents%20partages/PPM%20GRP/02.%20Impl%C3%A9mentation%20-%20Ecosyst%C3%A8mes/1_R%26D/Interface%20DP-VYP%20(remont%C3%A9e%20r%C3%A9el)/VYP_Interface%20DP-VYP_Consolidation%20Actuals%20%26%20Committed.pptx?d=wc1a11bd2007a4e77ad539a08bdebec84&csf=1&web=1&e=FBHlwE|smart-link]\n\nCe document a été validée par le Métier (en séance) lors des différentes réunions sur le sujet.", "to_value": "h3. +*Contexte*+ \n\nDans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des informations financières des projets.* ​\n\nDans le cas particulier des projets R&D présents dans VYP (Projets Enabling = Non-thérapeutique), cette consolidation se réalisera en 2 temps :\n\n# _Pour les données prévisionnelles (finalisé)_​\n\n* une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP en 2025 \n* depuis les données sont mises à jour dans VYP​\n\n# _Pour les données réelles (à réaliser)_\n\n* la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le type de données​\n* ces données sont ensuite transmises à la Data Platform (Data Warehouse Servier)​\n\nIl a été convenu suite à différents ateliers avec les métiers et le référents techniques que la point 2 sera réalisé en 3 “étapes/cas” : \n\n* *ETAPE 1 (one-shot)* : Récupération de l’historique des données Actuals & Committed → [https://data-servier.atlassian.net/browse/PPMG-1528|https://data-servier.atlassian.net/browse/PPMG-1528|smart-link] \n* *ETAPE 2 (daily)* : Mise a jour quotidienne des données Actuals & Committed en delta → [https://data-servier.atlassian.net/browse/PPMG-2177|https://data-servier.atlassian.net/browse/PPMG-2177|smart-link] \n* *ETAPE 3 (adhoc au besoin)* : Resynchronisation des données [https://data-servier.atlassian.net/browse/PPMG-2178|https://data-servier.atlassian.net/browse/PPMG-2178|smart-link] \n\nh3. +*Périmètre:*+\n\n* *Source :* Data Platform (export complet de l'historique).\n* *Cible :* VYP Planisware (chargement en masse dans l'environnement de production).\n* *Format :* Fichier {{.csv}} transmis par la Data Platform.\n* *Contenu :* Import en masse des données historiques des coûts R&D « Actuels » et « Committed » dans les tables : Actual Expenditures, Planned Expenditures, Actual Hours\n\nh3. +Mapping et description du fichier source:+ \n\nLe mapping détaillé entre les champs de la source et ceux de la cible est défini dans le fichier Excel [VYP_ConsolidationActualsCommittedRD_RequirementsList|https://serviergroup.sharepoint.com/:x:/r/sites/PPMtoolsCORP/_layouts/15/Doc.aspx?sourcedoc=%7B4213BED8-A51F-4DF3-A9BC-2A97707951E8%7D&file=VYP_ConsolidationActualsCommittedRD_INTERFACE_DP-TALEND-VYP_V1.xlsx&action=default&mobileredirect=true&DefaultItemOpen=1] dans les onglets suivants: \n\n* Format des fichiers \n* Planned Expenditures\n* Actual Expenditures\n* Actual Hours \n\nh3. +*Traitement attendu:*+\n\n* Les données du fichier {{.csv}} doivent être importées dans VYP et alimenter les 3 tables VYP suivantes selon le mapping précisé\n** Actual Expenditures\n** Planned Expenditures\n** Actual Hours\n* *Filtres à Appliquer par VYP lors du traitement :*\n** Exclure les lignes pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à {{VRAI}}.\n** La liste exacte des projets à exclure sera fournie par la R&D avant la phase de test et de mise en production.\n* *Contrôles VYP lors du Traitement :*\n** *Règles d'injection :*\n*** Si des données obligatoires sont absentes ou s'il y a une incohérence entre les référentiels Data Platform et VYP, aucune injection de données ni création de lignes de coûts ne doit être effectuée dans VYP.\n*** Pour les données non obligatoires, aucun traitement ni alerte ne doit être généré dans VYP.\n** *Gestion des erreurs :*\n*** Les détails des erreurs d'intégration doivent être consignés et consultables dans l'application VYP, via le module \"Administration\".\n*** La MOE VYP est responsable d'analyser la table d'erreur {{IMPEX Planisware}}.\n*** Les résultats de cette analyse doivent être synthétisés et transmis à l'AMOA VYP via le système de ticketing (JIRA), en précisant :\n**** Le nombre total de projets impactés.\n**** Le nombre de lignes de coûts erronées.\n**** Pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n*** Après vérification, l'AMOA partagera les informations avec le métier R&D.\n\nDocument de référence pour les spécifications fonctionnelles détaillées: \n\nCe document a été validée par le Métier (en séance) lors des différentes réunions sur le sujet.", "from_excerpt": "+*Contexte*+ | | Dans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des inform  Expenditures\n* Actual Hours \n\nh3. +*Filtres à Appliquer par la Data Platform (avant partage du fichier .csv) :*+\n\n* Inclure uniquement les lignes où {{'Project_type_Level_2' = 'Enabling projects'}}.\n* Inclure uniquement les lignes où {{'Project_status' = 'on going ou suspended ou stopped'}}.\n* Exclure les lignes pour lesquelles {{Account code = « R90024 »}} (correspondant aux coûts de refacturation DDSI sur la R&D).\n\nh3. +*Traitement attendu:*+\n\n* Les données du fichier {{.csv}} doivent être importées dans VYP et alimenter les 3 tables VYP suivantes selon le mapping précisé\n** Actual Expenditures\n** Planned Expenditures\n** Actual Hours\n* *Filtres à Appliquer par VYP lors du traitement :*\n** Exclure les lignes pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à {{VRAI}}.\n** La liste exacte des projets à exclure sera fournie par la R&D avant la phase de test et de mise en production.\n* *Contrôles VYP lors du Traitement :*\n** *Règles d'injection :*\n*** Si des données obligatoires sont absentes ou s'il y a une incohérence entre les référentiels Data Platform et VYP, aucune injection de données ni création de lignes de coûts ne doit être effectuée dans VYP.\n*** Pour les données non obligatoires, aucun traitement ni alerte ne doit être généré dans VYP.\n** *Gestion des erreurs :*\n*** Les détails des erreurs d'intégration doivent être consignés et consultables dans l'application VYP, via le module \"Administration\".\n*** La MOE VYP est responsable d'analyser la table d'erreur {{IMPEX Planisware}}.\n*** Les résultats de cette analyse doivent être synthétisés et transmis à l'AMOA VYP via le système de ticketing (JIRA), en précisant :\n**** Le nombre total de projets impactés.\n**** Le nombre de lignes de coûts erronées.\n**** Pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n*** Après vérification, l'AMOA partagera les informations avec le métier R&D.\n\n*Document de référence pour les spécifications fonctionnelles détaillées:* [VYP_Interface DP-VYP_Consolidation Actuals & Committed|https://serviergroup.sharepoint.com/:p:/r/sites/PPMtoolsCORP/_layouts/15/Doc.aspx?sourcedoc=%7BC1A11BD2-007A-4E77-AD53-9A08BDEBEC84%7D&file=VYP_Interface%20DP-VYP_Consolidation%20Actuals%20&%20Committed.pptx=&action=edit&mobileredirect=true]\n\nCe document a été validée par le Métier (en séance) lors des différentes réunions sur le sujet.", "from_excerpt": "h3. +*Contexte*+ | | Dans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des informations financières des projets.* ​ | | Dans le cas particulier des projets R&D présents dans VYP (Projets Enabling = Non-thérapeutique), cette consolidation se réalisera en 2 temps : | | # _Pour les données prévisionnelles (finalisé)_​ | | * une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP en 2025 | * depuis les données sont mises à jour dans VYP​ | | # _Pour les données réelles (à réaliser)_ | | * la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le type de données​ | * ces données sont ensuite transmises à la Data Platform (Data Warehouse Servier)​ | | Il a été convenu suite à différen...", "to_excerpt": "h3. +*Contexte*+ | | Dans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des informations financières des projets.* ​ | | Dans le cas particulier des projets R&D présents dans VYP (Projets Enabling = Non-thérapeutique), cette consolidation se réalisera en 2 temps : | | # _Pour les données prévisionnelles (finalisé)_​ | | * une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP en 2025 | * depuis les données sont mises à jour es, aucun traitement ni alerte ne doit être généré dans VYP.\n** *Gestion des erreurs :*\n*** Les détails des erreurs d'intégration doivent être consignés et consultables dans l'application VYP, via le module \"Administration\".\n*** La MOE VYP est responsable d'analyser la table d'erreur {{IMPEX Planisware}}.\n*** Les résultats de cette analyse doivent être synthétisés et transmis à l'AMOA VYP via le système de ticketing (JIRA), en précisant :\n**** Le nombre total de projets impactés.\n**** Le nombre de lignes de coûts erronées.\n**** Pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n*** Après vérification, l'AMOA partagera les informations avec le métier R&D.\n\n*Document de référence pour les spécifications fonctionnelles détaillées:* [VYP_Interface DP-VYP_Consolidation Actuals & Committed|https://serviergroup.sharepoint.com/:p:/r/sites/PPMtoolsCORP/_layouts/15/Doc.aspx?sourcedoc=%7BC1A11BD2-007A-4E77-AD53-9A08BDEBEC84%7D&file=VYP_Interface%20DP-VYP_Consolidation%20Actuals%20&%20Committed.pptx=&action=edit&mobileredirect=true]\n\nCe document a été validée par le Métier (en séance) lors des différentes réunions sur le sujet.", "from_excerpt": "h3. +*Contexte*+ | | Dans le cadre du projet PPM Groupe –VYP, la cible exprimée de *consolider au sein de VYP l’ensemble des informations financières des projets.* ​ | | Dans le cas particulier des projets R&D présents dans VYP (Projets Enabling = Non-thérapeutique), cette consolidation se réalisera en 2 temps : | | # _Pour les données prévisionnelles (finalisé)_​ | | * une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP en 2025 | * depuis les données sont mises à jour dans VYP​ | | # _Pour les données réelles (à réaliser)_ | | * la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le  \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-3 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-4 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-5 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-6 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-7 : Reporting des erreurs pour l'AMOA\nLa MOE VYP doit analyser la table d'erreur IMPEX Planisware et synthétiser les résultats pour les transmettre à l'AMOA VYP via un système de ticketing (JIRA).\nLe rapport doit inclure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-8 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "from_excerpt": "VERIFICATION DES DONNES IMPORTEES DANS L'OUTIL | AC 4 - Intégrité référentielle VYP : VYP rejette toute ligne dont le code MDM ou la Business Unit (BU) n'existe pas ou n'est pas cohérente avec l'année fiscale en cours. | AC 5 - Filtre d'exclusion VYP : Les projets dont le booléen \"Exclure la remontée du réel de la DP\" est activé dans VYP ne reçoivent aucune donnée de l'import, même s'ils sont présents dans le fichier source. | AC 6 - Complétude des tables : Les données sont correctement réparties dans les trois tables cibles de VYP : Actual Expenditures (coûts réels), Planned Expenditures (engagés/committed) et Actual Hours (temps passés).", "to_excerpt": "AC-1 : Importation massive des données historiques dans VYP | VYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours. | Le temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures. | | AC-2 : Respect du mapping VYP | Les données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList. | | AC-3 : Exclusion de projets par VYP | VYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRA...", "history_id": "4395214", "comment_id": ""}, {"issue_id": "382401", "key": "PPMG-1528", "url": "https://data-servier.atlassian.net/browse/PPMG-1528", "summary": "[R&D] [DP -> VYP] [FLUX 1] Consolidation Actuals & Commi e d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-3 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-4 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-5 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-6 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-7 : Reporting des erreurs pour l'AMOA\nLa MOE VYP doit analyser la table d'erreur IMPEX Planisware et synthétiser les résultats pour les transmettre à l'AMOA VYP via un système de ticketing (JIRA), lequel devra être étiqueté avec 'FLUX 1'\nLe rapport doit inclure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-8 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Importation massive des données historiques dans VYP\nVYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Indépendance fonctionnelle du Flux 1\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-5 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n doit pas dépasser 24 heures.\n\nAC-2 : Indépendance du Flux 1\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Absence de timeout - Flux 1\nLe Flux 1 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-5: Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion dans Actual Expenditures (External/Actual)\nLorsque Cost_subtype = 'External' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Actual Expenditures.\n\nAC-5.2 : Insertion dans Actual Hours (Internal/Actual)\nLorsque Cost_subtype = 'Internal' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'Standard Payroll' et insérer la ligne de coût résultante dans la table Actual Hours.\n\nAC-6 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-7 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-8 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-8 : Reporting des erreurs pour l'AMOA\nLa MOE VYP doit analyser la table d'erreur IMPEX Planisware et synthétiser les résultats pour les transmettre à l'AMOA VYP via un système de ticketing (JIRA), lequel devra être étiqueté avec 'FLUX 1'\nLe rapport doit inclure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-8 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Importation massive des données historiques dans VYP\nVYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Indépendance du Flux 1\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Absence de timeout - Flux 1\nLe Flux 1 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de pr manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-5: Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion dans Actual Expenditures (External/Actual)\nLorsque Cost_subtype = 'External' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Actual Expenditures.\n\nAC-5.2 : Insertion dans Actual Hours (Internal/Actual)\nLorsque Cost_subtype = 'Internal' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'Standard Payroll' et insérer la ligne de coût résultante dans la table Actual Hours.\n\nAC-5.3 : Insertion dans Planned Expenditures avec type \"Committed\"\nLorsque Cost_subtype = 'External' et Cost_status = 'Committed', VYP VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Planned Expenditures avec le type de dépense défini comme \"Committed\".\n\nAC-6 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-7 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou i "2026-08-10T09:57:21.171000+00:00", "author": "Yosra MANAI", "event_source": "changelog", "field": "Acceptance Criteria", "field_id": "customfield_10056", "change_type": "Acceptance Criteria modifiés", "from_value": "AC-1 : Importation massive des données historiques dans VYP\nVYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Indépendance du Flux 1\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Absence de timeout - Flux 1\nLe Flux 1 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-5: Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion dans Actual Expenditures (External/Actual)\nLorsque Cost_subtype = 'External' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Actual Expenditure ure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-8 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Importation massive des données historiques dans VYP\nVYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Indépendance du Flux 1\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Absence de timeout - Flux 1\nLe Flux 1 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-5: Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion da  Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût.\n\nAC-6 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-7 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-8 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-8 : Reporting des erreurs pour l'AMOA\nLa MOE VYP doit analyser la table d'erreur IMPEX Planisware et synthétiser les résultats pour les transmettre à l'AMOA VYP via un système de ticketing (JIRA), lequel devra être étiqueté avec 'FLUX 1'\nLe rapport doit inclure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-8 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Importation massive des données historiques dans VYP\nVYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Indépendance du Flux 1\nLe Flux 1 doit pouvoir déma  enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.6 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-5.7 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.8 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.9 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise dans ses données.\n\nAC-7 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-8 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-9 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-10 : Reporting des erreurs pour l'AMOA\nLa MOE VYP doit analyser la table d'erreur IMPEX Planisware et synthétiser les résultats pour les transmettre à l'AMOA VYP via un système de ticketing (JIRA), lequel devra être étiqueté avec 'FLUX 1'\nLe rapport doit inclure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-11 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Importation massive des données historiques dans VYP\nVYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Indépendance du Flux 1\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Absence de timeout - Flux 1\nLe Flux 1 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer a  et que l'immutable_key n'existe pas dans VYP, VYP doit ingérer la nouvelle ligne de données avec succès.\n\nAC-5.5 : Rejet NEW si immutable_key existe\nSi Line_Status = NEW et que l'immutable_key existe déjà dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans modifier les données existantes.\n\nAC-5.6 : Suppression DELETE réussie\nSi Line_Status = DELETE et que l'immutable_key existe dans VYP, VYP doit supprimer les données associées à cette immutable_key avec succès.\n\nAC-5.7 : Rejet DELETE si immutable_key n'existe pas\nSi Line_Status = DELETE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans tenter de suppression.\n\nAC-5.8 : Mise à jour UPDATE réussie\nSi Line_Status = UPDATE et que l'immutable_key existe dans VYP, VYP doit mettre à jour les données existantes associées à cette immutable_key avec succès.\n\nAC-5.9 : Rejet UPDATE si immutable_key n'existe pas\nSi Line_Status = UPDATE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans créer de nouvelle donnée.\n\nAC-5.10 : Validation Cost_Subtype - Invalide\nSi Cost_Subtype n'est ni 'External' ni 'Internal' (e.g., 'Other', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.11 : Validation Cost_status - Invalide\nSi Cost_status n'est ni 'Actual' ni 'Committed' (e.g., 'Forecast', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.12 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-5.13 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.14 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.15 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise dans ses données.\n\nAC-7 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-8 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-9 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-10 : Reporting des erreurs pour l'AMOA\nLa MOE VYP doit analyser la table d'erreur IMPEX Planisware et synthétiser les résultats pour les transmettre à l'AMOA VYP via un système de ticketing (JIRA), lequel devra être étiqueté avec 'FLUX 1'\nLe rapport doit inclure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-11 : Accès en écriture autorisé pour le profil P_ADM\nUn utilisateur ayant le profil P_ADM doit pouvoir modifier (cocher/décocher) et sauvegarder la valeur du booléen \"Exclure la remontée du réel de la Data Platform\" sur une classe projet.\nUn utilisateur n'ayant pas le profil P_ADM (PFM ou IO) ne doit pas pouvoir modifier la valeur du booléen \"Exclure la remontée du réel de la Data Platform\".\n\nAC-12 : Importation de coûts pour un projet \"Actif\" (ou \"On-going\")\nVYP doit pouvoir importer et traiter correctement les lignes de coûts (Actuals et Committed) pour un projet dont le statut actuel dans VYP est \"Actif\" (ou l'équivalent désigné pour les projets en cours).\nL'importation ne doit pas échouer en raison du statut \"Actif\" du projet.\n\nAC-13 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Importation massive des données historiques dans VYP\nVYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Indépendance du Flux 1\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Absence de timeout - Flux 1\nLe Flux 1 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement l de la Data Platform\".\n\nAC-12 : Importation de coûts pour un projet \"On-going\"\nVYP doit pouvoir importer et traiter correctement les lignes de coûts (Actuals et Committed) pour un projet dont le statut actuel dans VYP est \"Actif\" (ou l'équivalent désigné pour les projets en cours).\nL'importation ne doit pas échouer en raison du statut du projet.\nVYP doit pouvoir importer et traiter correctement les lignes de coûts (Actuals et Committed) pour un projet, indépendamment de son statut actuel dans VYP (par exemple, \"Actif\", \"Suspendu\", \"Stoppé\", \"Clos\", ou tout autre statut défini).\nL'importation des données de coûts ne doit en aucun cas être bloquée ou échouer en raison du statut actuel du projet.\n\nAC-13 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "to_value": "AC-1 : Importation massive des données historiques dans VYP\nVYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Indépendance du Flux 1\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Absence de timeout - Flux 1\nLe Flux 1 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du r les Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion dans Actual Expenditures (External/Actual)\nLorsque Cost_subtype = 'External' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Actual Expenditures.\n\nAC-5.2 : Insertion dans Actual Hours (Internal/Actual)\nLorsque Cost_subtype = 'Internal' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'Standard Payroll' et insérer la ligne de coût résultante dans la table Actual Hours.\n\nAC-5.3 : Insertion dans Planned Expenditures avec type \"Committed\"\nLorsque Cost_subtype = 'External' et Cost_status = 'Committed', VYP VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Planned Expenditures avec le type de dépense défini comme \"Committed\".\n\nAC-5.4 : Ingestion NEW réussie\nSi Line_Status = NEW et que l'immutable_key n'existe pas dans VYP, VYP doit ingérer la nouvelle ligne de données avec succès.\n\nAC-5.5 : Rejet NEW si immutable_key existe\nSi Line_Status = NEW et que l'immutable_key existe déjà dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans modifier les données existantes.\n\nAC-5.6 : Suppression DELETE réussie\nSi Line_Status = DELETE et que l'immutable_key existe dans VYP, VYP doit supprimer les données associées à cette immutable_key avec succès.\n\nAC-5.7 : Rejet DELETE si immutable_key n'existe pas\nSi Line_Status = DELETE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans tenter de suppression.\n\nAC-5.8 : Mise à jour UPDATE réussie\nSi Line_Status = UPDATE et que l'immutable_key existe dans VYP, VYP doit mettre à jour les données existantes associées à cette immutable_key avec succès.\n\nAC-5.9 : Rejet UPDATE si immutable_key n'existe pas\nSi Line_Status = UPDATE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans créer de nouvelle donnée.\n\nAC-5.10 : Validation Cost_Subtype - Invalide\nSi Cost_Subtype n'est ni 'External' ni 'Internal' (e.g., 'Other', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.11 : Validation Cost_status - Invalide\nSi Cost_status n'est ni 'Actual' ni 'Committed' (e.g., 'Forecast', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.12 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-5.13 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.14 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.15 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.16: Gestion des lignes de coûts avec un code projet introuvable\no Lors de l’importation de coûts, si une ligne de données contient un project_code (identifiant du projet) qui ne correspond à aucu er les données associées à cette immutable_key avec succès.\n\nAC-5.7 : Rejet DELETE si immutable_key n'existe pas\nSi Line_Status = DELETE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans tenter de suppression.\n\nAC-5.8 : Mise à jour UPDATE réussie\nSi Line_Status = UPDATE et que l'immutable_key existe dans VYP, VYP doit mettre à jour les données existantes associées à cette immutable_key avec succès.\n\nAC-5.9 : Rejet UPDATE si immutable_key n'existe pas\nSi Line_Status = UPDATE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans créer de nouvelle donnée.\n\nAC-5.10 : Validation Cost_Subtype - Invalide\nSi Cost_Subtype n'est ni 'External' ni 'Internal' (e.g., 'Other', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.11 : Validation Cost_status - Invalide\nSi Cost_status n'est ni 'Actual' ni 'Committed' (e.g., 'Forecast', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.12 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-5.13 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.14 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.15 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.16: Code projet introuvable\nLors de l’importation de coûts, si une ligne de données contient un project_code qui ne correspond à aucun projet existant dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-6 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise dans ses données.\n\nAC-7 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-8 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-9 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-10 : Reporting des erreurs pour l'AMOA\nLa MOE VYP doit analyser la table d'erreur IMPEX Planisware et synthétiser les résultats pour les transmettre à l'AMOA VYP via un système de ticketing (JIRA), lequel devra être étiqueté avec 'FLUX 1'\nLe rapport doit inclure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-11 : Acc uler la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.15 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.16: Code projet introuvable\nLors de l’importation de coûts, si une ligne de données contient un project_code qui ne correspond à aucun projet existant dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.17: valeur requise manquante ou invalide\no Lors de l’importation de coûts, si une ligne de données contient un champ obligatoire (par exemple, Cost_Type, Amount, Fiscal_Year, etc.) qui est vide, nul, ou contient une valeur considérée comme invalide par les règles de validation de VYP, cette ligne spécifique doit être rejetée.\n\nAC-6 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise dans ses données.\n\nAC-7 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-8 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-9 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-10 : Reporting des erreurs pour l'AMOA\nLa MOE VYP doit analyser la table d'erreur IMPEX Planisware et synthétiser les résultats pour les transmettre à l'AMOA VYP via un système de ticketing (JIRA), lequel devra être étiqueté avec 'FLUX 1'\nLe rapport doit inclure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-11 : Accès en écriture autorisé pour le profil P_ADM\nUn utilisateur ayant le profil P_ADM doit pouvoir modifier (cocher/décocher) et sauvegarder la valeur du booléen \"Exclure la remontée du réel de la Data Platform\" sur une classe projet.\nUn utilisateur n'ayant pas le profil P_ADM (PFM ou IO) ne doit pas pouvoir modifier la valeur du booléen \"Exclure la remontée du réel de la Data Platform\".\n\nAC-12 : Importation de coûts, quel que soit le statut du projet\nL'importation ne doit pas échouer en raison du statut du projet.\nVYP doit pouvoir importer et traiter correctement les lignes de coûts (Actuals et Committed) pour un projet, indépendamment de son statut actuel dans VYP.\nL'importation des données de coûts ne doit en aucun cas être bloquée ou échouer en raison du statut actuel du projet.\n\nAC-13 : Conformité au document de référence\nL'implémentation du Flux 1 doit être entièrement conforme aux spécifications fonctionnelles détaillées du document VYP_Interface DP-VYP_Consolidation Actuals & Committed.", "from_excerpt": "AC-1 : Importation massive des données historiques dans VYP | VYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours. | Le temps de traitement maximal pour cette importation massive ne doit p es de validation de VYP, cette ligne spécifique doit être rejetée.\n\nAC-6 : Vérification de l'existence de l'immutable_key\nAvant tout traitement (ingestion, suppression, mise à jour), VYP doit vérifier l'existence de l'immutable_key pour chaque ligne transmise dans ses données.\n\nAC-7 : Gestion des données obligatoires lors de l'injection VYP\nSi des données obligatoires pour la création ou la mise à jour d'une ligne de coût sont absentes ou incohérentes avec les référentiels VYP, VYP ne doit pas injecter la ligne de données ni créer de ligne de coût correspondante.\n\nAC-8 : Traitement des données non obligatoires\nSi des données non obligatoires sont absentes ou incohérentes, VYP ne doit générer aucun traitement spécifique ni alerte pour ces lignes.\n\nAC-9 : Journalisation des erreurs d'intégration\nLes détails de toutes les erreurs d'intégration (lignes rejetées, incohérences) doivent être consignés et consultables dans l'application VYP via le module \"Administration\".\n\nAC-10 : Reporting des erreurs pour l'AMOA\nLa MOE VYP doit analyser la table d'erreur IMPEX Planisware et synthétiser les résultats pour les transmettre à l'AMOA VYP via un système de ticketing (JIRA), lequel devra être étiqueté avec 'FLUX 1'\nLe rapport doit inclure : le nombre total de projets impactés, le nombre de lignes de coûts erronées, et pour chaque type d'opération (mise à jour, création, suppression), le nombre et la liste des projets impactés (par code PPM).\n\nAC-11 : Accès en écriture autorisé pour le profil P_ADM\nUn utilisateur ayant le profil P_ADM doit pouvoir modifier (cocher/décocher) et sauvegarder la valeur du booléen \"Exclure la remontée du réel de la Data Platform\" sur une classe projet.\nUn utilisateur n'ayant pas le profil P_ADM (PFM ou IO) ne doit pas pouvoir modifier la valeur du booléen \"Exclure la remontée du réel de la Data Platform\".\n\nAC-12 : Importation de coûts, quel que soit le statut du projet\nL'importation ne doit pas échouer en raison du statut "history_id": "4397174", "comment_id": ""}, {"issue_id": "382401", "key": "PPMG-1528", "url": "https://data-servier.atlassian.net/browse/PPMG-1528", "summary": "[R&D] [DP -> VYP] [FLUX 1] Consolidation Actuals & Committed - Récupération de l'historique (one shot)", "project_key": "PPMG", "issue_type": "Story", "current_status": "In Refinement", "current_assignee": "Yosra MANAI", "current_sprints": "Sprint 17 2026", "event_date": "2026-08-10T14:39:48.478000+00:00", "author": "Yosra MANAI", "event_source": "changelog", "field": "Acceptance Criteria", "field_id": "customfield_10056", "change_type": "Acceptance Criteria modifiés", "from_value": "AC-1 : Importation massive des données historiques dans VYP\nVYP doit être en mesure d'importer un volume massif de données, supérieur à 30 000 lignes, concernant l'historique des coûts R&D (catégories \"Actuels\" et \"Committed\") dans les tables Actual Expenditures, Planned Expenditures et Actual Hours.\nLe temps de traitement maximal pour cette importation massive ne doit pas dépasser 24 heures.\n\nAC-2 : Indépendance du Flux 1\nLe Flux 1 doit pouvoir démarrer et s'exécuter jusqu'à sa complétion, quel que soit l'état (succès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Absence de timeout - Flux 1\nLe Flux 1 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-5: Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion dans Actual Expenditures (External/Actual)\nLorsque Cost_subtype = 'External' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Actual Expenditures.\n\nAC-5.2 : Insertion dans Actual Hours (Internal/Actual)\nLorsque Cost_subtype = 'Internal' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'Standard Payroll' et insérer la ligne de coût résultante dans la table Actual Hours.\n\nAC-5.3 : Insertion dans Planned Expenditures avec type \"Committed\"\nLorsque Cost_subtype = 'External' et Cost_status = 'Committed', VYP VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Planned Expenditures avec le type de dépense défini comme \"Committed\".\n\nAC-5.4 : Ingestion NEW réussie\nSi Line_Status = NEW et que l'immutable_key n'existe pas dans VYP, VYP doit ingérer la nouvelle ligne de données avec succès.\n\nAC-5.5 : Rejet NEW si immutable_key existe\nSi Line_Status = NEW et que l'immutable_key existe déjà dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans modifier les données existantes.\n\nAC-5.6 : Suppression DELETE réussie\nSi Line_Status = DELETE et que l'immutable_key existe dans VYP, VYP doit supprimer les données associées à cette immutable_key avec succès.\n\nAC-5.7 : Rejet DELETE si immutable_key n'existe pas\nSi Line_Status = DELETE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans tenter de suppression.\n\nAC-5.8 : Mise à jour UPDATE réussie\nSi Line_Status = UPDATE et que l'immutable_key existe dans VYP, VYP doit mettre à jour les données existantes associées à cette immutable_key avec succès.\n\nAC-5.9 : Rejet UPDATE si immutable_key n'existe pas\nSi Line_Status = UPDATE et que l'immutable_key n'existe pas dans VYP, VYP doit rejeter la ligne de données et enregistrer une erreur, sans créer de nouvelle donnée.\n\nAC-5.10 : Validation Cost_Subtype - Invalide\nSi Cost_Subtype n'est ni 'External' ni 'Internal' (e.g., 'Other', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.11 : Validation Cost_status - Invalide\nSi Cost_status n'est ni 'Actual' ni 'Committed' (e.g., 'Forecast', vide), VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.12 : Traduction unit conforme aux spécifications techniques\nPour chaque ligne importée, VYP doit traduire la valeur du champ 'unit' en 'MD', 'KEUR' ou 'Ressource' conformément à la logique définie dans la spécification technique détaillée.\n\nAC-5.13 : Calcul correct de la date de début du coût\nVYP doit calculer la date de début du coût (start date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.14 : Calcul correct de la date de fin du coût\nVYP doit calculer la date de fin du coût (end date) pour chaque ligne en se basant sur les champs 'Fiscal year' et 'month' du fichier source, en appliquant la logique de traduction spécifiée dans les spécifications techniques.\n\nAC-5.15 : Rejet des lignes si Business Unit projet non conforme\nSi la Business Unit du projet associé à une ligne de coût ne correspond pas aux Business Units des Departments Lead ou Department Involved existants dans VYP, VYP doit rejeter la ligne de coût et enregistrer une erreur consultable dans le module \"Administration\".\n\nAC-5.16: Code projet introuvable\nLors de l’importation de coûts, si une ligne de données contient un project_code qui ne correspond à aucun projet existant dans VYP, VYP doit rejeter la ligne de c uccès, échec, non exécuté) des Flux 2 et Flux 3.\nUn échec du Flux 2 ou Flux 3 ne doit pas empêcher le lancement ou le traitement correct du Flux 1.\n\nAC-3 : Absence de timeout - Flux 1\nLe Flux 1 doit s'exécuter de manière complète pour le volume de données attendu (e.g., > 30 000 lignes) sans rencontrer de dépassement de délai (timeout) défini par le système VYP.\n\nAC-4 : Exclusion de projets par VYP\nVYP doit exclure du traitement les lignes de données pour lesquelles le Boolean \"Exclure la remontée du réel de la Data Platform\" sur la classe projet est égal à VRAI.\nCette exclusion doit s'appliquer aux projets spécifiés dans la liste fournie par la R&D avant la phase de test et de mise en production.\n\nAC-5: Respect du mapping VYP\nLes données importées dans VYP via le fichier .csv doivent alimenter les tables Actual Expenditures, Planned Expenditures, et Actual Hours en respectant précisément le mapping défini dans le document VYP_ConsolidationActualsCommittedRD_RequirementsList.\n\nAC-5.1 : Insertion dans Actual Expenditures (External/Actual)\nLorsque Cost_subtype = 'External' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Actual Expenditures.\n\nAC-5.2 : Insertion dans Actual Hours (Internal/Actual)\nLorsque Cost_subtype = 'Internal' et Cost_status = 'Actual', VYP doit traduire le Cost_Account en 'Standard Payroll' et insérer la ligne de coût résultante dans la table Actual Hours.\n\nAC-5.3 : Insertion dans Planned Expenditures avec type \"Committed\"\nLorsque Cost_subtype = 'External' et Cost_status = 'Committed', VYP VYP doit traduire le Cost_Account en 'External Cost' et insérer la ligne de coût résultante dans la table Planned Expenditures avec le type de dépense défini comme \"Committed\".\n\nAC-5.4 : Ingestion NEW réussie\nSi Line_Status = NEW et que l'immutable_key n'existe pas dans VYP, VYP doit ingérer la nouvelle ligne de données avec succès.\n\nAC-5.5 : Rejet ur les données prévisionnelles (finalisé)_​\n\n* une initialisation des données « _FTE / Internal Payroll_ » & « _Externals Costs_ » a été réalisée sur la base d’une extraction DP {color:#ff5630}(date : ??)​{color}\n* depuis les données sont mises à jour dans VYP​\n\n# _Pour les données réelles (à réaliser)_\n\n* la saisie des « Actuals » (données coûts réels) & “Committed” (données coûts engagés) est aujourd’hui réalisée dans différents outils selon le type de données​\n* ces données sont ensuite transmises à la Data Platform (Data Warehouse Servier)​\n\nIl a été convenu suite à différents ateliers avec les métiers et le référents techniques que la point 2 sera réalisé en 3 “étapes” : \n\n* *ETAPE 1 (one-shot)* : Récupération de l’historique des données Actuals & Committed → [https://data-servier.atlassian.net/browse/PPMG-1528|https://data-servier.atlassian.net/browse/PPMG-1528|smart-link] \n* *ETAPE 2 (daily)* : Mise a jour quotidienne des données Actuals & Committed en delta → [https://data-servier.atlassian.net/browse/PPMG-2177|https://data-servier.atlassian.net/browse/PPMG-2177|smart-link] \n* *ETAPE 3 (adhoc au besoin)* : Resynchronisation des données [https://data-servier.atlassian.net/browse/PPMG-2178|https://data-servier.atlassian.net/browse/PPMG-2178|smart-link] \n\n+*Périmètre:*+\n\n* Interface DP → VYP via API Talend\n* Mise à jour des tables : Actual Expenditures, Planned Expenditures, Actual Hours\n\n+*Résultats attendus :*+\n\nMettre à jour les lignes de coût en fonction des informations reçues quotidiennement\n\nLe détail du besoin fonctionnels et informations est disponible dans le document [https://serviergroup.sharepoint.com/:p:/r/sites/PPMtoolsCORP/Documents%20partages/PPM%20GRP/02.%20Impl%C3%A9mentation%20-%20Ecosyst%C3%A8mes/1_R%26D/Interface%20DP-VYP%20(remont%C3%A9e%20r%C3%A9el)/VYP_Interface%20DP-VYP_Consolidation%20Actuals%20%26%20Committed.pptx?d=wc1a11bd2007a4e77ad539a08bdebec84&csf=1&web=1&e=FBHlwE|https://serviergroup.sharepoint.com/:p:
